# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4098m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Default codegen target. Without this, a plain assembleGithubDebug falls through to
# BuildParameters.cmake's -march=armv8.1-a, so the dev-loop build tests DIFFERENT codegen
# than any released APK - and FEAT_FP16 / FEAT_DotProd, which are optional at ARMv8.2 and
# must be named explicitly, never get emitted at all.
#
# tools/build-release-targets.sh passes -Parmsx2.march= on the command line, which takes
# precedence over this, so the legacy armv8-a release tier is unaffected.
#
# Trade-off: debug APKs built with this will SIGILL on pre-ARMv8.2 devices. Correct for a
# fork that targets the Thor (8 Gen 2, and the Lite's 865 is ARMv8.2 too); wrong if you
# hand a debug build to someone on an older phone.
armsx2.march=armv8.2-a+fp16+dotprod

# Fork identity: this fork installs as its own app, next to official ARMSX2 (com.armsx2) instead
# of replacing it - the same way upstream's nightly ships as com.armsx2.nightly. Only the
# applicationId changes; the Kotlin namespace stays com.armsx2, so activity class names do not
# (adb: `am start -n com.armsx2.thor/com.armsx2.Main`). Its SharedPreferences, app-private data
# folder and storage permission are its own; pick a data folder of its own in the setup wizard
# too, so the two apps never share memory cards or the settings backup.
armsx2.applicationId=com.armsx2.thor
